name: Build UWP Spider Launcher

on:
  push:
    branches: [ "arena/894f616b-uwp-spider-launcher", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create Signing Certificate
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=SpiderMan Import Test" -KeyUsage DigitalSignature -FriendlyName "UWP Spider Launcher Dev Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $password = ConvertTo-SecureString -String "SpiderManDev2026!" -Force -AsPlainText
          $pfxPath = Join-Path (Get-Location) "SpiderManDevKey.pfx"
          $cerPath = Join-Path (Get-Location) "packages\SpiderManLauncher.cer"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          Write-Output "Certificate created and exported to $cerPath"

      - name: Build Launcher
        shell: powershell
        run: |
          $pfxPath = Join-Path (Get-Location) "SpiderManDevKey.pfx"
          .\build\build-launcher.ps1 -VisualStudio "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" -CertificatePath $pfxPath -CertificatePassword "SpiderManDev2026!"

          # If no package was created in packages\, package AppX layout with makeappx
          $packages = Get-ChildItem -Recurse packages -Include *.msix,*.appx
          if (-not $packages) {
              Write-Output "Checking for AppX layout directory..."
              $appxDir = Get-ChildItem -Recurse -Directory -Path source\bin\x64\Release -Filter "AppX" | Select-Object -First 1
              if (-not $appxDir) {
                  $appxDir = Get-ChildItem -Recurse -Directory -Path source -Filter "AppX" | Select-Object -First 1
              }
              if ($appxDir) {
                  $makeappx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Select-Object -Last 1).FullName
                  $targetPackage = Join-Path (Get-Location) "packages\SpiderManInstaller_x64.msix"
                  Write-Output "Packing $($appxDir.FullName) to $targetPackage"
                  & $makeappx pack /d $appxDir.FullName /p $targetPackage /nv
              } else {
                  Write-Output "AppX directory not found; searching all output files in source\bin:"
                  Get-ChildItem -Recurse source\bin | Select-Object FullName
              }
          }

          # Collect all required x64 UWP dependencies
          New-Item -ItemType Directory -Force -Path packages\Dependencies | Out-Null
          Get-ChildItem -Path "C:\Program Files (x86)\Microsoft SDKs\Windows Kits\10\ExtensionSDKs" -Recurse -Include *.appx | Where-Object { $_.FullName -like "*\x64\*" -and ($_.Name -like "*NET.Native*" -or $_.Name -like "*VCLibs*") } | ForEach-Object {
              Write-Output "Found dependency: $($_.FullName)"
              Copy-Item $_.FullName -Destination "packages\Dependencies\" -Force
          }

          # Ensure all packages are signed with signtool
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          Write-Output "Using SignTool at $signtool"
          Get-ChildItem -Recurse packages -Include *.msix,*.appx | ForEach-Object {
              Write-Output "Signing package: $($_.FullName)"
              & $signtool sign /fd SHA256 /f $pfxPath /p "SpiderManDev2026!" $_.FullName
          }
          Get-ChildItem -Recurse packages

      - name: Upload Launcher Package
        uses: actions/upload-artifact@v4
        with:
          name: UWP-Spider-Launcher-Package
          path: packages/**
